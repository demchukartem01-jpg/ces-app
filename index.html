<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CES — Морские тесты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --deep-navy: #0a1929;
    --mid-navy: #14283d;
    --steel: #2c4a63;
    --brass: #c8973f;
    --brass-bright: #e0b15c;
    --foam: #e8eef2;
    --foam-dim: #a9bcc9;
    --danger: #c4543a;
    --success: #4a8f6e;
    --font-display: 'Roboto Slab', Georgia, serif;
    --font-body: -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: radial-gradient(ellipse at top, var(--mid-navy), var(--deep-navy) 65%);
    color: var(--foam);
    font-family: var(--font-body);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* Header */
  .header {
    padding: 28px 20px 22px;
    border-bottom: 1px solid rgba(200, 151, 63, 0.25);
    position: relative;
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -10%;
    width: 220px;
    height: 220px;
    background: radial-gradient(circle, rgba(200,151,63,0.12), transparent 70%);
    pointer-events: none;
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brass);
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .eyebrow::before {
    content: '';
    width: 16px;
    height: 1px;
    background: var(--brass);
  }

  h1 {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 700;
    margin-top: 8px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    color: var(--foam-dim);
    font-size: 14px;
    margin-top: 6px;
    max-width: 480px;
  }

  /* Sections list */
  .sections {
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .section-card {
    background: linear-gradient(135deg, var(--mid-navy), rgba(20, 40, 61, 0.6));
    border: 1px solid rgba(200, 151, 63, 0.18);
    border-radius: 14px;
    padding: 18px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.1s ease;
    position: relative;
    overflow: hidden;
  }

  .section-card:active {
    transform: scale(0.98);
    border-color: rgba(200, 151, 63, 0.5);
  }

  .section-number {
    font-family: var(--font-display);
    font-size: 13px;
    color: var(--brass);
    border: 1px solid rgba(200, 151, 63, 0.4);
    border-radius: 50%;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-weight: 600;
  }

  .section-info { flex: 1; min-width: 0; }

  .section-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--foam);
  }

  .section-meta {
    font-size: 12.5px;
    color: var(--foam-dim);
    margin-top: 3px;
  }

  .section-arrow {
    color: var(--brass);
    font-size: 18px;
    flex-shrink: 0;
  }

  /* Quiz view */
  .quiz-view {
    display: none;
    padding: 20px 16px;
  }

  .quiz-view.active { display: block; }
  .sections.hidden, .header.hidden { display: none; }

  .progress-bar {
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 24px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--brass), var(--brass-bright));
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  .question-counter {
    font-size: 12px;
    color: var(--brass);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .question-text {
    font-family: var(--font-display);
    font-size: 19px;
    line-height: 1.4;
    margin-bottom: 24px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    background: var(--mid-navy);
    border: 1px solid rgba(200, 151, 63, 0.18);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    color: var(--foam);
    cursor: pointer;
    transition: all 0.12s ease;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .option:active { transform: scale(0.98); }

  .option-letter {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid rgba(200,151,63,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    color: var(--brass);
    flex-shrink: 0;
    font-weight: 600;
  }

  .option.correct {
    border-color: var(--success);
    background: rgba(74, 143, 110, 0.15);
  }
  .option.correct .option-letter {
    background: var(--success);
    border-color: var(--success);
    color: white;
  }

  .option.wrong {
    border-color: var(--danger);
    background: rgba(196, 84, 58, 0.15);
  }
  .option.wrong .option-letter {
    background: var(--danger);
    border-color: var(--danger);
    color: white;
  }

  .back-btn {
    background: none;
    border: none;
    color: var(--foam-dim);
    font-size: 14px;
    margin-bottom: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Result view */
  .result-view {
    display: none;
    padding: 40px 24px;
    text-align: center;
  }
  .result-view.active { display: block; }

  .result-score {
    font-family: var(--font-display);
    font-size: 56px;
    font-weight: 700;
    color: var(--brass-bright);
    line-height: 1;
  }

  .result-label {
    color: var(--foam-dim);
    font-size: 14px;
    margin-top: 8px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .result-message {
    margin-top: 24px;
    font-size: 15px;
    color: var(--foam);
    line-height: 1.5;
  }

  .restart-btn {
    margin-top: 28px;
    background: var(--brass);
    color: var(--deep-navy);
    border: none;
    border-radius: 12px;
    padding: 14px 28px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="header" id="header">
  <div class="eyebrow">CES · Подготовка моряков</div>
  <h1>Морские тесты</h1>
  <p class="subtitle">Выбери раздел, чтобы начать проверку знаний</p>
</div>

<div class="sections" id="sections">
  <!-- Разделы подставляются через JS из data.js -->
</div>

<div class="quiz-view" id="quizView">
  <button class="back-btn" onclick="exitQuiz()">← Назад к разделам</button>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="question-counter" id="questionCounter"></div>
  <div class="question-text" id="questionText"></div>
  <div class="options" id="optionsList"></div>
</div>

<div class="result-view" id="resultView">
  <div class="result-score" id="resultScore"></div>
  <div class="result-label">Правильных ответов</div>
  <div class="result-message" id="resultMessage"></div>
  <button class="restart-btn" onclick="exitQuiz()">Вернуться к разделам</button>
</div>

<script src="data.js"></script>
<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  let currentSection = null;
  let currentQuestionIndex = 0;
  let correctCount = 0;
  let answered = false;

  function renderSections() {
    const container = document.getElementById('sections');
    container.innerHTML = '';
    TEST_SECTIONS.forEach((section, i) => {
      const card = document.createElement('div');
      card.className = 'section-card';
      card.onclick = () => startSection(i);
      card.innerHTML = `
        <div class="section-number">${String(i + 1).padStart(2, '0')}</div>
        <div class="section-info">
          <div class="section-title">${section.title}</div>
          <div class="section-meta">${section.questions.length} вопросов</div>
        </div>
        <div class="section-arrow">→</div>
      `;
      container.appendChild(card);
    });
  }

  function startSection(index) {
    currentSection = TEST_SECTIONS[index];
    currentQuestionIndex = 0;
    correctCount = 0;
    document.getElementById('header').classList.add('hidden');
    document.getElementById('sections').classList.add('hidden');
    document.getElementById('resultView').classList.remove('active');
    document.getElementById('quizView').classList.add('active');
    renderQuestion();
  }

  function renderQuestion() {
    answered = false;
    const q = currentSection.questions[currentQuestionIndex];
    const total = currentSection.questions.length;

    document.getElementById('progressFill').style.width =
      ((currentQuestionIndex) / total * 100) + '%';
    document.getElementById('questionCounter').textContent =
      `Вопрос ${currentQuestionIndex + 1} из ${total}`;
    document.getElementById('questionText').textContent = q.question;

    const list = document.getElementById('optionsList');
    list.innerHTML = '';
    const letters = ['А', 'Б', 'В', 'Г', 'Д'];
    q.options.forEach((opt, i) => {
      const el = document.createElement('div');
      el.className = 'option';
      el.innerHTML = `<div class="option-letter">${letters[i]}</div><div>${opt}</div>`;
      el.onclick = () => selectAnswer(i, el);
      list.appendChild(el);
    });
  }

  function selectAnswer(index, el) {
    if (answered) return;
    answered = true;
    const q = currentSection.questions[currentQuestionIndex];
    const allOptions = document.querySelectorAll('.option');

    if (index === q.correctIndex) {
      el.classList.add('correct');
      correctCount++;
      if (tg) tg.HapticFeedback?.notificationOccurred('success');
    } else {
      el.classList.add('wrong');
      allOptions[q.correctIndex].classList.add('correct');
      if (tg) tg.HapticFeedback?.notificationOccurred('error');
    }

    setTimeout(() => {
      if (currentQuestionIndex + 1 < currentSection.questions.length) {
        currentQuestionIndex++;
        renderQuestion();
      } else {
        showResult();
      }
    }, 900);
  }

  function showResult() {
    document.getElementById('quizView').classList.remove('active');
    document.getElementById('resultView').classList.add('active');
    const total = currentSection.questions.length;
    document.getElementById('resultScore').textContent = `${correctCount}/${total}`;

    const pct = correctCount / total;
    let msg = '';
    if (pct === 1) msg = 'Отлично! Все ответы верны.';
    else if (pct >= 0.7) msg = 'Хороший результат, есть над чем поработать.';
    else msg = 'Стоит повторить материал раздела и попробовать снова.';
    document.getElementById('resultMessage').textContent = msg;
  }

  function exitQuiz() {
    document.getElementById('quizView').classList.remove('active');
    document.getElementById('resultView').classList.remove('active');
    document.getElementById('header').classList.remove('hidden');
    document.getElementById('sections').classList.remove('hidden');
  }

  renderSections();
</script>
</body>
</html>
